<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoveMail hand model check</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #173732;
        background: #fffaf0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
        margin: 0;
      }

      main {
        width: min(100%, 48rem);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 3px solid #cbded3;
        border-radius: 2rem;
        background: #fffef9;
        box-shadow: 0 20px 60px rgba(24, 66, 55, 0.13);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.05;
      }

      p {
        font-size: 1.2rem;
        line-height: 1.55;
      }

      #status {
        padding: 1rem;
        border-radius: 1rem;
        background: #eff7e8;
        font-weight: 800;
      }

      [data-test-status="passed"] #status {
        border: 3px solid #2d7658;
      }

      [data-test-status="failed"] #status {
        border: 3px solid #b64338;
        background: #fff0ea;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Local hand model check</h1>
      <p>
        This test loads the packaged MediaPipe code, WASM and hand model. It
        does not request or use a camera.
      </p>
      <p id="status" role="status" aria-live="polite">
        Preparing the local model…
      </p>
    </main>
    <script type="module">
      import { HandEngine } from "../js/hand-engine.js";

      const status = document.querySelector("#status");
      const engine = new HandEngine();

      try {
        await engine.initialise();
        status.textContent = "PASS — Local hand model loaded successfully.";
        document.documentElement.dataset.testStatus = "passed";
      } catch (error) {
        status.textContent = `FAIL — ${error.userMessage || error.message}`;
        document.documentElement.dataset.testStatus = "failed";
      } finally {
        await engine.destroy();
      }
    </script>
  </body>
</html>
